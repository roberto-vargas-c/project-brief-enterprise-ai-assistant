<div class="wrap" id="wrap">
  <svg id="svg" viewBox="0 0 __W__ __H__" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M32 0H0V32" fill="none" stroke="rgba(139,151,181,.10)" stroke-width="1"/></pattern>
      <radialGradient id="halo"><stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
        <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    </defs>
    <style id="scale-style"></style>
    <rect x="-3000" y="-3000" width="7000" height="7000" fill="url(#grid)"/>
    <g id="cam">
      <g id="dots"></g>
      <g id="links"></g>
      <circle id="focus-ring" r="0" fill="none" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <g id="hits"></g>
      <g id="question"></g>
    </g>
  </svg>
  <div class="controls">
    <button id="zin" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="focus" title="Back to my question"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button id="all" title="Show the whole map"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
    <button id="fs" title="Full screen"><svg viewBox="0 0 24 24"><path id="fs-icon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="hint">Scroll to zoom · drag to move · hover a dot · click a numbered passage</div>
  <div class="tip" id="tip"></div>
  <div class="panel" id="panel"><button class="close" id="close" title="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="panel-body"></div></div>
</div>
<div class="legend" id="legend"></div>

<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: Inter, "Source Sans Pro", sans-serif; color: #8b97b5; }
  .wrap { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid rgba(139,151,181,.18);
          background: radial-gradient(ellipse at 50% 40%, #151f3d, #070b18 75%); }
  #svg { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; user-select: none; }
  #svg.dragging { cursor: grabbing; }
  :fullscreen body, body:fullscreen { background: #070b18; }
  :fullscreen .wrap { height: calc(100vh - 44px); border-radius: 0; border: 0; }
  :fullscreen #svg { height: 100%; }
  :fullscreen .legend { padding: 0 16px; }
  .dot { opacity: 0; animation: pop .5s ease forwards; }
  .hide { display: none; }
  .link { opacity: .9; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease forwards; }
  .pop { opacity: 0; animation: hit .5s cubic-bezier(.3,1.6,.5,1) forwards; }
  .hit { cursor: pointer; }
  .hit:hover .s circle { stroke: #67e8f9; }
  .land { animation: land .9s cubic-bezier(.3,1.4,.5,1) .6s both; }
  .halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: halo 2.4s ease-out 1.4s infinite; }
  @keyframes pop { to { opacity: .75; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes hit { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes land { from { transform: translateY(-300px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes halo { 0% { opacity: .9; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.6); } }
  .controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
  .controls button, .close { width: 32px; height: 32px; border-radius: 9px; border: 1px solid rgba(139,151,181,.25);
          background: rgba(11,18,36,.85); color: #e6e9f5; display: grid; place-items: center; cursor: pointer;
          transition: border-color .15s, transform .15s; padding: 0; }
  .controls button:hover, .close:hover { border-color: #8b5cf6; transform: translateY(-1px); }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
               stroke-linejoin: round; }
  .hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #8b97b5; background: rgba(7,11,24,.7);
          padding: 3px 8px; border-radius: 999px; pointer-events: none; }
  .tip { position: absolute; pointer-events: none; background: rgba(11,18,36,.95); color: #e6e9f5; font-size: 12px;
         padding: 6px 9px; border-radius: 8px; border: 1px solid rgba(139,151,181,.3); max-width: 280px;
         opacity: 0; transition: opacity .1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tip small { display: block; color: #8b97b5; }
  .panel { position: absolute; top: 10px; left: 10px; width: min(340px, 60%); max-height: calc(100% - 20px); overflow: auto;
           background: rgba(11,18,36,.95); border: 1px solid rgba(139,92,246,.5); border-radius: 12px; padding: 12px 14px;
           color: #e6e9f5; font-size: 13px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .panel.open { display: block; animation: in .2s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .panel .close { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; }
  .panel h4 { margin: 0 30px 4px 0; font-size: 14px; }
  .panel .meta { color: #8b97b5; font-size: 12px; }
  .panel .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; margin: 6px 4px 0 0;
                background: rgba(139,92,246,.2); color: #ddd6fe; }
  .panel .tag.cited { background: rgba(52,211,153,.18); color: #6ee7b7; }
  .panel p { margin: 8px 0 0; line-height: 1.5; color: #cbd5e1; white-space: pre-wrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; margin-top: 8px; }
  .legend span { padding: 2px 9px; border-radius: 999px; border: 1px solid transparent; }
  .legend .area { cursor: pointer; user-select: none; transition: opacity .15s, border-color .15s; }
  .legend .area:hover { border-color: rgba(139,151,181,.35); }
  .legend .area.off { opacity: .35; text-decoration: line-through; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
</style>

<script>
const D = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $("svg"), cam = $("cam"), scaleStyle = $("scale-style");
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// -- draw ---------------------------------------------------------------------------------
const dotsG = $("dots");
D.x.forEach((x, i) => el("circle", {cx: x, cy: D.y[i], fill: D.colors[D.a[i]], class: `dot a${D.a[i]}`,
  style: `animation-delay:${(i % 40) * 0.012}s`}, dotsG));
const linksG = $("links"), hitsG = $("hits");
D.hits.forEach((h, j) => {
  const delay = 2.9 + h.rank * 0.2;
  el("line", {x1: D.q[0], y1: D.q[1], x2: h.x, y2: h.y, stroke: h.color, pathLength: 1,
    class: "link", style: `animation-delay:${delay}s`}, linksG);
  const g = el("g", {class: "hit", "data-j": j, transform: `translate(${h.x},${h.y})`}, hitsG);
  const pop = el("g", {class: "pop", style: `animation-delay:${delay + .35}s`}, g);
  const s = el("g", {class: "s"}, pop);
  el("circle", {r: 9, fill: h.color, stroke: h.cited ? "#fff" : "#070b18", "stroke-width": h.cited ? 2.6 : 2}, s);
  el("text", {y: 3.6, "text-anchor": "middle", "font-size": 10, "font-weight": 700, fill: "#070b18"}, s).textContent = h.rank;
});
const qG = el("g", {transform: `translate(${D.q[0]},${D.q[1]})`}, $("question"));
el("circle", {class: "halo", r: 40, fill: "url(#halo)"}, el("g", {class: "s"}, qG));
const qs = el("g", {class: "s"}, el("g", {class: "land"}, qG));
el("circle", {r: 11, fill: "#fbbf24", stroke: "#fff", "stroke-width": 2.4}, qs);
el("text", {y: 4, "text-anchor": "middle", "font-size": 11, "font-weight": 800, fill: "#070b18"}, qs).textContent = "Q";

// -- camera: k = zoom, (x, y) = translation --------------------------------------------------
let view = {k: 1, x: 0, y: 0}, tween = null;
function apply() {
  cam.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
  // markers keep the same size on screen; dots grow a little when zooming in
  scaleStyle.textContent = `.s{transform:scale(${1 / view.k})} .dot{r:${1.4 / Math.pow(view.k, .55)}px}` +
    ` .link{stroke-width:${1.6 / view.k}px}`;
}
function target(k, cx, cy) { const vb = svg.viewBox.baseVal;
  return {k, x: vb.x + vb.width / 2 - cx * k, y: vb.y + vb.height / 2 - cy * k}; }
function animateTo(t, ms = 700, delay = 0) {
  cancelAnimationFrame(tween); const from = {...view}; let start = null;
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const step = ts => { if (start === null) start = ts + delay; const p = Math.max(0, Math.min(1, (ts - start) / ms));
    const e = ease(p); view = {k: from.k + (t.k - from.k) * e, x: from.x + (t.x - from.x) * e, y: from.y + (t.y - from.y) * e};
    apply(); if (p < 1) tween = requestAnimationFrame(step); };
  tween = requestAnimationFrame(step);
}
const focusView = () => target(D.zoom, D.center[0], D.center[1]);
const allView = () => target(1, D.W / 2, D.H / 2);
function zoomAt(factor, sx, sy) {  // sx, sy in viewBox units
  cancelAnimationFrame(tween); const k = Math.max(.5, Math.min(60, view.k * factor)); const f = k / view.k;
  view = {k, x: sx - (sx - view.x) * f, y: sy - (sy - view.y) * f}; apply();
}
function toViewBox(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse()); }
function center() { const vb = svg.viewBox.baseVal; return [vb.x + vb.width / 2, vb.y + vb.height / 2]; }

apply();
animateTo(focusView(), 1200, 1700);  // intro: zoom on the question and its passages

svg.addEventListener("wheel", e => { e.preventDefault(); const p = toViewBox(e);
  zoomAt(Math.exp(-e.deltaY * 0.0015), p.x, p.y); }, {passive: false});
svg.addEventListener("dblclick", e => { const p = toViewBox(e); zoomAt(2, p.x, p.y); });
let drag = null;
svg.addEventListener("pointerdown", e => { cancelAnimationFrame(tween); drag = {p: toViewBox(e), v: {...view}, moved: false};
  svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); });
svg.addEventListener("pointermove", e => {
  if (drag) { const p = toViewBox(e); const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
    view = {k: drag.v.k, x: drag.v.x + dx, y: drag.v.y + dy}; apply(); hideTip(); return; }
  hover(e);
});
svg.addEventListener("pointerup", e => { svg.classList.remove("dragging");
  const wasClick = drag && !drag.moved; drag = null; if (!wasClick) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY)?.closest(".hit");
  if (hit) openPanel(+hit.dataset.j); else if (nearest >= 0) openDot(nearest); });
svg.addEventListener("pointerleave", hideTip);
$("zin").onclick = () => zoomAt(1.6, ...center());
$("zout").onclick = () => zoomAt(1 / 1.6, ...center());
$("focus").onclick = () => animateTo(focusView());
$("all").onclick = () => animateTo(allView());

// -- hover: nearest visible dot within 10 screen px ------------------------------------------
const tip = $("tip"), ring = $("focus-ring"), hidden = new Set();
let nearest = -1;
function hover(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const w = p.matrixTransform(cam.getScreenCTM().inverse()), px = cam.getScreenCTM().a;
  let best = -1, bd = (10 / px) ** 2;
  for (let i = 0; i < D.x.length; i++) { if (hidden.has(D.a[i])) continue;
    const d = (D.x[i] - w.x) ** 2 + (D.y[i] - w.y) ** 2; if (d < bd) { bd = d; best = i; } }
  nearest = best;
  if (best < 0) { hideTip(); return; }
  ring.setAttribute("cx", D.x[best]); ring.setAttribute("cy", D.y[best]); ring.setAttribute("r", 5 / px);
  const box = $("wrap").getBoundingClientRect();
  tip.innerHTML = `${esc(D.labels[best])}<small>${esc(D.areas[D.a[best]] || "Other")} · click for details</small>`;
  tip.style.left = Math.min(e.clientX - box.left + 14, box.width - 290) + "px";
  tip.style.top = (e.clientY - box.top + 14) + "px"; tip.style.opacity = 1;
}
function hideTip() { tip.style.opacity = 0; ring.setAttribute("r", 0); nearest = -1; }

// -- detail panel -----------------------------------------------------------------------------
const panel = $("panel"), body = $("panel-body");
function openPanel(j) { const h = D.hits[j];
  body.innerHTML = `<h4>[${h.rank}] ${esc(h.label)}</h4><div class="meta">${esc(h.area)}</div>` +
    `<span class="tag">picked as passage ${h.rank}</span>` + (D.answered ? (h.cited ? `<span class="tag cited">cited in the answer</span>`
    : `<span class="tag">not cited</span>`) : "") + `<p>${esc(h.snippet)}</p>`;
  panel.classList.add("open"); }
function openDot(i) { const j = D.hits.findIndex(h => h.i === i); if (j >= 0) return openPanel(j);
  body.innerHTML = `<h4>${esc(D.labels[i])}</h4><div class="meta">${esc(D.areas[D.a[i]] || "Other")}</div>` +
    `<p>This chunk was not picked for your question. Chunks near the yellow Q talk about similar things.</p>`;
  panel.classList.add("open"); }
$("close").onclick = () => panel.classList.remove("open");

// -- legend: click an area to hide or show it -------------------------------------------------
const legend = $("legend");
const present = new Set(D.a);
D.areas.forEach((a, idx) => { if (!present.has(idx)) return; const s = document.createElement("span"); s.className = "area";
  s.innerHTML = `<i style="background:${D.colors[idx]}"></i>${esc(a)}`; s.title = "Click to hide or show";
  s.onclick = () => { const off = !hidden.has(idx); off ? hidden.add(idx) : hidden.delete(idx); s.classList.toggle("off", off);
    document.querySelectorAll(`.a${idx}`).forEach(d => d.classList.toggle("hide", off)); };
  legend.appendChild(s); });
legend.insertAdjacentHTML("beforeend", `<span><i style="background:#fbbf24"></i>your question (Q)</span>` +
  `<span><i style="background:#34d399"></i>cited</span>`);

// -- full screen: the viewBox follows the screen's shape so the map fills it -----------------
function fitViewBox() {
  const full = !!document.fullscreenElement, r = svg.getBoundingClientRect();
  const H = full && r.width ? D.W * r.height / r.width : D.H;
  const c = center(); svg.setAttribute("viewBox", `0 ${(D.H - H) / 2} ${D.W} ${H}`);
  const n = center(); view.x += n[0] - c[0]; view.y += n[1] - c[1]; apply();
}
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen()
  : document.documentElement.requestFullscreen().catch(() => {});
document.addEventListener("fullscreenchange", () => {
  $("fs").title = document.fullscreenElement ? "Exit full screen" : "Full screen";
  $("fs-icon").setAttribute("d", document.fullscreenElement ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"
    : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");
  requestAnimationFrame(fitViewBox); });
window.addEventListener("resize", () => { if (document.fullscreenElement) fitViewBox(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") panel.classList.remove("open"); });
</script>
